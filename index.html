<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Treasure Hunt ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    text-align: center;

    font-family: Georgia, serif;
    color: white;

    background:
        radial-gradient(circle at top, #64243f, transparent 45%),
        linear-gradient(135deg, #10070d, #32101f, #10070d);
}

.container {
    width: 90%;
    max-width: 650px;
    position: relative;
    z-index: 2;
    padding: 30px 0;
}

.heart {
    font-size: 48px;
    animation: heartbeat 1.5s infinite;
}

h1 {
    font-size: clamp(30px, 8vw, 50px);
    margin: 15px 0;
}

.card {
    margin-top: 30px;
    padding: 30px 22px;
    border-radius: 25px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,200,220,.18);

    box-shadow: 0 0 30px rgba(255,120,170,.12);

    backdrop-filter: blur(8px);
}

.clue-number {
    color: #ffb5cf;
    letter-spacing: 4px;
    font-size: 13px;
    margin-bottom: 18px;
}

h2 {
    color: #ffd5e3;
}

.clue {
    font-size: 19px;
    line-height: 1.8;
}

.hint {
    margin-top: 20px;
    color: #e8b9cb;
    font-size: 15px;
}

input {
    width: 90%;
    max-width: 450px;

    margin-top: 25px;
    padding: 15px;

    border: none;
    border-radius: 30px;

    text-align: center;
    font-size: 16px;

    outline: none;
}

button,
.button {
    display: inline-block;

    margin-top: 18px;
    padding: 15px 28px;

    border: none;
    border-radius: 50px;

    background: linear-gradient(
        135deg,
        #ffb4cf,
        #f58fb3
    );

    color: #351020;

    font-weight: bold;
    font-size: 16px;

    cursor: pointer;
    text-decoration: none;
}

.message {
    margin-top: 18px;
    min-height: 30px;
}

.success {
    color: #baffd0;
}

.wrong {
    color: #ffb3c5;
}

.progress {
    margin-top: 20px;
    color: #e9b7c9;
    font-size: 14px;
}

.test {
    margin-top: 18px;
    color: #ff9fc3;
    font-size: 12px;
    letter-spacing: 3px;
}

.floating-heart {
    position: fixed;
    bottom: -40px;

    color: rgba(255,180,210,.65);

    font-size: 20px;

    animation: floatUp linear forwards;

    pointer-events: none;
}

@keyframes floatUp {

    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}
</style>
</head>


<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>Our Little Treasure Hunt</h1>

    <div class="card" id="content"></div>

</div>


<script>

/* =====================================================
   TEST MODE
   ===================================================== */

const TEST_MODE = true;


/* =====================================================
   CLUES
   ===================================================== */

const clues = [

{
    number: "CLUE 1",

    title: "🐺 THE ONE WHO MADE ME CRY",

    text: `
    Out of all the deaths in Game of Thrones,
    which completely insignificant little character's
    death had me sitting there like 😭?
    `,

    hint: `
    Hint: Jon Snow knows nothing… but you should know this. 😂❤️
    `,

    answers: [
        "olly"
    ]
},


{
    number: "CLUE 2",

    title: "🌴 THE PLACE",

    text: `
    If our love story had a vacation chapter,
    where would you find it? 🌴❤️
    `,

    hint: `
    Hint: It was our honeymoon destination.
    `,

    answers: [
        "pollachi"
    ]
},


{
    number: "CLUE 3",

    title: "💕 THE NAMES",

    text: `
    Everyone knows my real name…
    but you decided I needed two more. 😂

    What are the two names you gave me?
    `,

    hint: `
    Hint: You know them better than anyone.
    `,

    answers: [
        "pops and monican",
        "pops + monican",
        "pops monican"
    ]
},


{
    number: "CLUE 4",

    title: "📍 WHERE IT ALL STARTED",

    text: `
    Before the honeymoon, before the nicknames,
    before all these memories…

    there was a place where our story quietly began. ❤️

    You were the one who sent me the link to that place.

    Where was it?
    `,

    hint: `
    Hint: Think about where our story started.
    `,

    answers: [
        "indian bank kallakurichi",
        "indian bank, kallakurichi",
        "indian bank kallakurichi branch"
    ]
},


{
    number: "CLUE 5",

    title: "♾️ THE FIRST GIFT",

    text: `
    Remember the first gift I gave you? 👀

    The one that mysteriously disappeared from your life… 😂

    What did it say?
    `,

    hint: `
    Hint: A little reminder that has no end. ♾️
    `,

    answers: [
        "to infinity and beyond"
    ]
},


{
    number: "CLUE 6",

    title: "🤍 THE WHITE SHIRT",

    text: `
    There’s one particular look of yours
    that I’ve told you about more than once… 👀

    The one I keep replaying in my head.

    What am I talking about?
    `,

    hint: `
    Hint: Think of that one look you keep talking about. 🤍
    `,

    answers: [
        "chest hair white shirt",
        "chest hair whiteshirt",
        "chest hair in white shirt",
        "your chest hair showing through your white shirt"
    ]
},


{
    number: "CLUE 7",

    title: "💵 THE DENOMINATION",

    text: `
    You taught me so many things at work…

    Which cash denomination do I use the least?
    `,

    hint: `
    Hint: Think about all those days we've spent handling cash together. 😏
    `,

    answers: [
        "200",
        "₹200",
        "rs 200",
        "rs. 200"
    ]
},


{
    number: "CLUE 8",

    title: "🏡 THE FUTURE",

    text: `
    After everything we've built together… ❤️

    If our little family grows one day,
    there's one little dream I carry in my heart.

    What do you think I'd wish for? 🥹
    `,

    hint: `
    Hint: Think of someone very special to me…
    and a tiny version of him. ❤️
    `,

    answers: [
        "a son like you",
        "son like you"
    ]
}

];


/* =====================================================
   TEST PROGRESS
   ===================================================== */

let currentClue = 0;


/* =====================================================
   NORMALISE ANSWER
   ===================================================== */

function normalise(value) {

    return value
        .toLowerCase()
        .trim()
        .replace(/[.,!?₹]/g, "")
        .replace(/\s+/g, " ");

}


/* =====================================================
   SHOW CURRENT CLUE
   ===================================================== */

function showClue() {

    const content =
        document.getElementById("content");

    const clue =
        clues[currentClue];


    content.innerHTML = `

        <div class="clue-number">
            ${clue.number}
        </div>

        <h2>
            ${clue.title}
        </h2>

        <div class="clue">
            ${clue.text}
        </div>

        <div class="hint">
            ${clue.hint}
        </div>

        <input
            id="answer"
            type="text"
            placeholder="Type your answer..."
            autocomplete="off"
        >

        <br>

        <button onclick="checkAnswer()">
            🔓 UNLOCK
        </button>

        <div
            id="message"
            class="message">
        </div>

        <div class="progress">
            ${currentClue} / 8 clues solved ❤️
        </div>

        <div class="test">
            TEST MODE
        </div>

    `;

}


/* =====================================================
   CHECK ANSWER
   ===================================================== */

function checkAnswer() {

    const clue =
        clues[currentClue];

    const input =
        document.getElementById("answer");

    const message =
        document.getElementById("message");

    const userAnswer =
        normalise(input.value);


    const correct =
        clue.answers.some(
            answer =>
            normalise(answer) === userAnswer
        );


    if (correct) {

        message.className =
            "message success";

        message.innerHTML =
            "🎉 Correct! ❤️";


        input.disabled = true;


        setTimeout(() => {

            currentClue++;

            if (currentClue >= clues.length) {

                showFinal();

            } else {

                showClue();

            }

        }, 1200);


    } else {

        message.className =
            "message wrong";

        message.innerHTML =
            "Hmm… 😏 That's not it. Try again ❤️";

    }

}


/* =====================================================
   FINAL TREASURE
   ===================================================== */

function showFinal() {

    const content =
        document.getElementById("content");


    content.innerHTML = `

        <div class="clue-number">
            🎉 YOU FOUND THE TREASURE 🎉
        </div>

        <div class="clue">

            You solved every clue…<br><br>

            but the real treasure was you all along. ❤️

            <br><br>

            <strong>
            Happy 1st Anniversary, Sheshi.
            </strong>

            <br><br>

            Here's to our little family,
            our little world,
            and everything still waiting for us. ♾️

        </div>


        <a
            class="button"
            href="canvas_our-story-260818_1459.pdf"
            target="_blank">

            💌 OPEN YOUR SURPRISE

        </a>


        <div class="progress">
            8 / 8 clues solved ❤️
        </div>


        <div class="test">
            TEST COMPLETE
        </div>

    `;

}


/* =====================================================
   ENTER KEY
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            const input =
                document.getElementById("answer");

            if (input) {
                checkAnswer();
            }

        }

    }
);


/* =====================================================
   START
   ===================================================== */

showClue();


/* =====================================================
   FLOATING HEARTS
   ===================================================== */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    heart.innerHTML =
        Math.random() > 0.5
        ? "❤️"
        : "♡";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(
        () => heart.remove(),
        10000
    );

}

setInterval(
    createHeart,
    700
);

</script>

</body>
</html>
